# ============================================================
# Gzip 压缩配置（详细版）
# ============================================================
# 注意：以下配置应在 http 块中使用

# 启用 Gzip 压缩
gzip on;

# 启用 Vary 响应头（告诉代理服务器根据 Accept-Encoding 缓存不同版本）
gzip_vary on;

# 对所有代理请求启用压缩
gzip_proxied any;

# 压缩级别（1-9，数字越大压缩率越高但 CPU 消耗越大）
# 推荐值：6（在压缩率和 CPU 消耗之间取得平衡）
gzip_comp_level 6;

# 最小压缩大小（小于此值不压缩，避免压缩小文件反而增加大小）
gzip_min_length 1024;

# 压缩缓冲区配置
gzip_buffers 16 8k;

# 支持的 HTTP 版本
gzip_http_version 1.1;

# 需要压缩的 MIME 类型
gzip_types
    # 文本类型
    text/plain
    text/css
    text/xml
    text/javascript
    text/x-component
    text/x-js
    text/richtext
    text/xsd
    text/xsl
    text/xml
    # 应用类型
    application/json
    application/javascript
    application/x-javascript
    application/xml
    application/xml+rss
    application/atom+xml
    application/xhtml+xml
    application/manifest+json
    application/ld+json
    application/geo+json
    application/vnd.ms-fontobject
    application/x-font-ttf
    application/x-font-opentype
    application/x-font-truetype
    # 图片类型（SVG 是文本格式，可以压缩）
    image/svg+xml
    image/x-icon
    # 字体类型
    font/ttf
    font/otf
    font/woff
    font/woff2
    font/opentype;

# 禁用对已压缩文件的压缩
gzip_disable "msie6";

# 压缩变体（处理不同编码）
gzip_static on;

# ============================================================
# Brotli 压缩配置（如果安装了 ngx_brotli 模块）
# ============================================================
# Brotli 是比 Gzip 更高效的压缩算法
# 需要安装 ngx_brotli 模块

# brotli on;
# brotli_comp_level 6;
# brotli_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
# brotli_min_length 1024;
# brotli_buffers 16 8k;

# ============================================================
# 缓存路径配置
# ============================================================
# 注意：以下配置应在 http 块中使用

# 代理缓存路径配置
# levels: 缓存目录层级
# keys_zone: 共享内存区域名称和大小
# max_size: 最大缓存大小
# inactive: 不活跃文件删除时间
# use_temp_path: 是否使用临时路径
proxy_cache_path /var/cache/nginx/proxy 
                 levels=1:2 
                 keys_zone=api_cache:10m 
                 max_size=500m 
                 inactive=60m 
                 use_temp_path=off;

# 静态文件缓存路径
proxy_cache_path /var/cache/nginx/static 
                 levels=1:2 
                 keys_zone=static_cache:50m 
                 max_size=1g 
                 inactive=7d 
                 use_temp_path=off;

