# ============================================================
# 浏览器缓存控制头说明
# ============================================================
# Cache-Control 响应头值说明:
#
# public:           响应可以被任何缓存存储（包括 CDN）
# private:          响应只能被浏览器缓存，不能被代理缓存
# no-cache:         使用前必须验证
# no-store:         完全不缓存
# must-revalidate:  过期后必须验证
# max-age=秒数:     缓存有效期
# immutable:        资源永不变化（用于带版本哈希的文件）
#
# 示例配置:
# - 静态资源（带哈希）: Cache-Control: public, max-age=31536000, immutable
# - 静态资源（无哈希）: Cache-Control: public, max-age=86400
# - API 响应:          Cache-Control: private, max-age=300
# - 敏感数据:          Cache-Control: no-store, no-cache, must-revalidate

# ============================================================
# ETag 和 Last-Modified 配置
# ============================================================
# 启用 ETag（实体标签，用于缓存验证）
etag on;

# 启用 Last-Modified 头
# Nginx 默认启用，基于文件修改时间

# ============================================================
# 预压缩文件配置
# ============================================================
# 对于静态文件，可以预先使用 Gzip 压缩，Nginx 直接发送压缩文件
# 节省 CPU 资源
#
# 1. 预压缩文件命名: original.js.gz
# 2. Nginx 配置:
# gzip_static on;  # 自动查找 .gz 文件
# gzip_static always;  # 总是发送 .gz 文件（即使客户端不支持 gzip）

# ============================================================
# 缓存状态监控
# ============================================================
# $upstream_cache_status 变量值说明:
#
# HIT:       缓存命中
# MISS:      缓存未命中
# EXPIRED:   缓存已过期
# STALE:     使用过期缓存（后端不可用时）
# UPDATING:  正在更新缓存
# REVALIDATED: 缓存重新验证成功
# BYPASS:    绕过缓存

# 在日志中记录缓存状态:
# log_format cache_log '$remote_addr - [$time_local] "$request" '
#                      '$status $body_bytes_sent "$http_referer" '
#                      'Cache: $upstream_cache_status';
