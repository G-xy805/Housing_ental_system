# ============================================================
# 房屋租赁系统 - Nginx SSL 配置模板
# ============================================================
# 版本: 1.0.0
# 更新日期: 2026-03-13
# 说明: 此文件为 SSL 配置模板，使用前请替换证书路径
# ============================================================

# ============================================================
# SSL 证书配置
# ============================================================
# 证书路径（请替换为实际证书路径）
ssl_certificate /etc/nginx/ssl/housing-rental.crt;
ssl_certificate_key /etc/nginx/ssl/housing-rental.key;

# DH 参数（增强安全性，需要预先生成）
# 生成命令: openssl dhparam -out /etc/nginx/ssl/dhparam.pem 2048
ssl_dhparam /etc/nginx/ssl/dhparam.pem;

# ============================================================
# SSL 协议和加密套件配置
# ============================================================
# 支持的 SSL 协议（仅 TLS 1.2 和 1.3）
ssl_protocols TLSv1.2 TLSv1.3;

# 加密套件配置（推荐配置）
ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;

# 服务器加密套件优先
ssl_prefer_server_ciphers on;

# ============================================================
# SSL 会话配置
# ============================================================
# 会话缓存（共享缓存，10MB 可存储约 40000 个会话）
ssl_session_cache shared:SSL:10m;

# 会话超时时间
ssl_session_timeout 1d;

# 会话票据（启用可提高性能，但可能影响前向保密）
ssl_session_tickets off;

# ============================================================
# OCSP Stapling 配置（在线证书状态协议装订）
# ============================================================
# 启用 OCSP Stapling
ssl_stapling on;
ssl_stapling_verify on;

# OCSP 响应者 URL（可选，通常从证书中自动获取）
# ssl_stapling_responder http://ocsp.example.com;

# 解析器配置（用于 OCSP 验证）
resolver 8.8.8.8 8.8.4.4 1.1.1.1 valid=300s;
resolver_timeout 5s;

# ============================================================
# 安全头配置
# ============================================================

# HSTS (HTTP Strict Transport Security)
# 强制浏览器使用 HTTPS 连接
# max-age: 有效期（秒），建议 1 年
# includeSubDomains: 包含所有子域名
# preload: 允许加入浏览器预加载列表
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

# 防止点击劫持
add_header X-Frame-Options "SAMEORIGIN" always;

# 防止 MIME 类型嗅探
add_header X-Content-Type-Options "nosniff" always;

# XSS 防护
add_header X-XSS-Protection "1; mode=block" always;

# 引用策略
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# 内容安全策略（根据实际需求调整）
# 注意：此配置较严格，可能需要根据应用需求调整
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https:; frame-ancestors 'self'; base-uri 'self'; form-action 'self';" always;

# 权限策略（Feature Policy）
add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;

# ============================================================
# HTTPS 重定向配置（在 HTTP server 块中使用）
# ============================================================
# 将以下配置添加到 HTTP server 块中实现 HTTPS 重定向
#
# server {
#     listen 80;
#     listen [::]:80;
#     server_name your-domain.com;
#     
#     # 重定向所有 HTTP 请求到 HTTPS
#     return 301 https://$server_name$request_uri;
#     
#     # 或者使用 rewrite
#     # rewrite ^(.*)$ https://$host$1 permanent;
# }

# ============================================================
# SSL 配置验证命令
# ============================================================
# 1. 测试 Nginx 配置语法:
#    nginx -t
#
# 2. 检查 SSL 证书:
#    openssl x509 -in /etc/nginx/ssl/housing-rental.crt -text -noout
#
# 3. 测试 SSL 连接:
#    openssl s_client -connect your-domain.com:443 -servername your-domain.com
#
# 4. 测试 SSL 配置评分:
#    使用 https://www.ssllabs.com/ssltest/ 进行在线测试
#
# 5. 生成自签名证书（仅用于测试）:
#    openssl req -x509 -nodes -days 365 -newkey rsa:2048 \
#      -keyout /etc/nginx/ssl/housing-rental.key \
#      -out /etc/nginx/ssl/housing-rental.crt

# ============================================================
# Let's Encrypt 免费证书配置示例
# ============================================================
# 使用 Certbot 获取 Let's Encrypt 证书:
#
# 1. 安装 Certbot:
#    sudo apt-get install certbot python3-certbot-nginx
#
# 2. 获取证书:
#    sudo certbot --nginx -d your-domain.com -d www.your-domain.com
#
# 3. 自动续期测试:
#    sudo certbot renew --dry-run
#
# Let's Encrypt 证书路径:
# ssl_certificate /etc/letsencrypt/live/your-domain.com/fullchain.pem;
# ssl_certificate_key /etc/letsencrypt/live/your-domain.com/privkey.pem;
