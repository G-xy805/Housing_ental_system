# ============================================================
# 房屋租赁系统 - Nginx 主配置文件
# ============================================================
# 版本: 1.0.0
# 更新日期: 2026-03-13
# ============================================================

# 工作进程配置
worker_processes auto;
worker_rlimit_nofile 65535;

# 错误日志配置
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

# 事件模块配置
events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

# HTTP 模块配置
http {
    # ============================================================
    # 基础配置
    # ============================================================
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # 日志格式定义
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" '
                    'uht="$upstream_header_time" urt="$upstream_response_time"';

    log_format json_combined escape=json '{'
        '"time_local":"$time_local",'
        '"remote_addr":"$remote_addr",'
        '"remote_user":"$remote_user",'
        '"request":"$request",'
        '"status":"$status",'
        '"body_bytes_sent":"$body_bytes_sent",'
        '"request_time":"$request_time",'
        '"http_referrer":"$http_referer",'
        '"http_user_agent":"$http_user_agent",'
        '"http_x_forwarded_for":"$http_x_forwarded_for",'
        '"upstream_addr":"$upstream_addr",'
        '"upstream_status":"$upstream_status",'
        '"upstream_response_time":"$upstream_response_time"'
    '}';

    access_log /var/log/nginx/access.log main;

    # 性能优化
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    # 缓冲区配置
    client_body_buffer_size 128k;
    client_max_body_size 50m;
    large_client_header_buffers 4 16k;

    # ============================================================
    # Gzip 压缩配置
    # ============================================================
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    
    # 压缩的 MIME 类型
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        application/atom+xml
        image/svg+xml
        font/ttf
        font/otf
        font/woff
        font/woff2;
    
    # 禁用对已压缩文件的压缩
    gzip_disable "msie6";

    # ============================================================
    # 缓存配置
    # ============================================================
    
    # 静态文件缓存路径配置
    proxy_cache_path /var/cache/nginx/proxy levels=1:2 keys_zone=api_cache:10m 
                     max_size=100m inactive=60m use_temp_path=off;
    
    # FastCGI 缓存（用于 PHP 等，本项目不使用）
    # fastcgi_cache_path /var/cache/nginx/fastcgi levels=1:2 keys_zone=php_cache:10m 
    #                    max_size=100m inactive=60m use_temp_path=off;

    # ============================================================
    # 上游服务器配置
    # ============================================================
    upstream backend_server {
        # Flask 后端服务器
        server 127.0.0.1:5000 weight=5;
        
        # 保持连接配置
        keepalive 32;
        keepalive_timeout 60s;
        keepalive_requests 1000;
    }

    upstream frontend_server {
        # Vite 开发服务器或静态文件服务
        server 127.0.0.1:5173;
        keepalive 16;
    }

    # ============================================================
    # 限流配置
    # ============================================================
    # 限制请求速率（防止 DDoS）
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/m;
    limit_req_zone $binary_remote_addr zone=upload_limit:10m rate=2r/s;
    
    # 限制连接数
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    # ============================================================
    # 安全配置
    # ============================================================
    # 隐藏 Nginx 版本号
    server_tokens off;
    
    # 防止点击劫持
    add_header X-Frame-Options "SAMEORIGIN" always;
    
    # 防止 MIME 类型嗅探
    add_header X-Content-Type-Options "nosniff" always;
    
    # XSS 防护
    add_header X-XSS-Protection "1; mode=block" always;
    
    # 引用策略
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ============================================================
    # 服务器配置 - HTTP (开发环境)
    # ============================================================
    server {
        listen 80;
        listen [::]:80;
        server_name localhost housing-rental.local;

        # 访问日志
        access_log /var/log/nginx/housing_access.log main;
        error_log /var/log/nginx/housing_error.log warn;

        # 根目录
        root /var/www/housing-rental/dist;
        index index.html;

        # ============================================================
        # 静态文件服务配置
        # ============================================================
        
        # Vue 前端静态文件
        location / {
            # 尝试顺序：精确文件 -> 目录 -> index.html (SPA 路由支持)
            try_files $uri $uri/ /index.html;
            
            # 静态资源缓存
            expires 1d;
            add_header Cache-Control "public, immutable";
            
            # 安全头
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-XSS-Protection "1; mode=block" always;
        }

        # 静态资源（带版本哈希的文件，长期缓存）
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable";
            access_log off;
            
            # 安全头
            add_header X-Content-Type-Options "nosniff" always;
        }

        # HTML 文件（不缓存）
        location ~* \.html$ {
            expires -1;
            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
            add_header Pragma "no-cache";
        }

        # ============================================================
        # API 请求代理配置
        # ============================================================
        
        # API 请求代理到 Flask 后端
        location /api/ {
            # 代理配置
            proxy_pass http://backend_server;
            proxy_http_version 1.1;
            
            # 请求头设置
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;
            
            # WebSocket 支持
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            
            # 超时配置
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
            
            # 缓冲配置
            proxy_buffering on;
            proxy_buffer_size 4k;
            proxy_buffers 8 32k;
            proxy_busy_buffers_size 64k;
            
            # 限流（API 通用限制）
            limit_req zone=api_limit burst=20 nodelay;
            limit_conn conn_limit 10;
            
            # CORS 配置（如果前端和后端不同域）
            add_header Access-Control-Allow-Origin * always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Authorization, Content-Type, Accept, X-Requested-With" always;
            add_header Access-Control-Allow-Credentials true always;
            
            # 预检请求处理
            if ($request_method = 'OPTIONS') {
                add_header Access-Control-Allow-Origin *;
                add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS";
                add_header Access-Control-Allow-Headers "Authorization, Content-Type, Accept, X-Requested-With";
                add_header Access-Control-Allow-Credentials true;
                add_header Content-Length 0;
                add_header Content-Type text/plain;
                return 204;
            }
        }

        # 登录接口特殊限流
        location /api/auth/login {
            proxy_pass http://backend_server;
            proxy_http_version 1.1;
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # 登录限流（更严格）
            limit_req zone=login_limit burst=5 nodelay;
            limit_conn conn_limit 5;
        }

        # 文件上传接口
        location /api/upload {
            proxy_pass http://backend_server;
            proxy_http_version 1.1;
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # 上传文件大小限制
            client_max_body_size 50m;
            
            # 上传限流
            limit_req zone=upload_limit burst=5 nodelay;
            limit_conn conn_limit 3;
            
            # 增加超时时间
            proxy_connect_timeout 300s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;
        }

        # 健康检查端点（不记录日志）
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        # Nginx 状态页面（仅限内网访问）
        location /nginx_status {
            stub_status on;
            access_log off;
            allow 127.0.0.1;
            allow 10.0.0.0/8;
            allow 172.16.0.0/12;
            allow 192.168.0.0/16;
            deny all;
        }

        # ============================================================
        # 错误页面配置
        # ============================================================
        error_page 404 /404.html;
        location = /404.html {
            root /var/www/housing-rental/dist;
            internal;
        }

        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root /var/www/housing-rental/dist;
            internal;
        }
    }

    # ============================================================
    # 服务器配置 - HTTPS (生产环境，需要 SSL 证书)
    # ============================================================
    # 取消注释以下配置并配置 SSL 证书后启用
    # 
    # server {
    #     listen 80;
    #     listen [::]:80;
    #     server_name your-domain.com;
    #     
    #     # HTTP 重定向到 HTTPS
    #     return 301 https://$server_name$request_uri;
    # }
    #
    # server {
    #     listen 443 ssl http2;
    #     listen [::]:443 ssl http2;
    #     server_name your-domain.com;
    #
    #     # SSL 配置（引入外部配置文件）
    #     include /etc/nginx/ssl.conf;
    #
    #     # ... 其他配置与 HTTP 服务器相同 ...
    # }
}
